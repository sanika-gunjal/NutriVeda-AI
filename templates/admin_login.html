{% extends "base.html" %}
{% block title %}Admin Login — NutriVeda AI{% endblock %}

{% block body %}
<div class="content-plain" style="background:linear-gradient(160deg, var(--ink), var(--green-900)); position:relative; overflow:hidden; display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div class="card card-sm reveal in-view" style="position:relative;z-index:1;">

    <div class="eyebrow">Owner Access</div>
    <h2 style="font-size:1.5rem;font-weight:800;color:var(--green-900);margin-bottom:4px;">🔑 Admin Login</h2>
    <p style="color:var(--text-soft);font-size:0.88rem;margin-bottom:20px;">View all registered users, symptom history, and feedback in one place.</p>

    <form action="/admin/login" method="POST">
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" name="username" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn btn-block" type="submit" style="margin-top:8px;">Log In as Admin</button>
    </form>

  </div>
</div>
{% endblock %}
